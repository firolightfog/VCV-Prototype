name: Build VCV Rack Plugin for Windows
on:
  push:
    branches: [v1]
  workflow_dispatch:  # Allows manual triggering

env:
  rack-sdk-version: 2.4.0

defaults:
  run:
    shell: bash

jobs:
  build-windows:
    name: Build Windows Plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install Windows cross-compilation tools
        run: |
          sudo apt-get update
          # Install mingw for Windows cross-compilation
          sudo apt-get install -y mingw-w64 g++-mingw-w64-x86-64
          # Install premake and build tools
          sudo apt-get install -y premake4 build-essential wget git
          echo "Installed mingw version:"
          x86_64-w64-mingw32-g++ --version
          
      - name: Download premake5 (for Windows efsw build)
        run: |
          wget -q https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-linux.tar.gz
          tar -xzf premake-5.0.0-beta2-linux.tar.gz
          chmod +x premake5
          sudo mv premake5 /usr/local/bin/
          echo "Premake5:"
          premake5 --version
          
      - name: Download Rack SDK for cross-compilation
        run: |
          # Download the Windows Rack SDK for cross-compilation
          wget -q https://vcvrack.com/downloads/Rack-SDK-${{ env.rack-sdk-version }}-win.zip
          unzip -q Rack-SDK-${{ env.rack-sdk-version }}-win.zip -d rack-sdk-win
          echo "Windows SDK downloaded to: $(pwd)/rack-sdk-win"
          
      - name: Set up Windows cross-compile environment
        run: |
          # Set environment for Windows cross-compilation
          export RACK_DIR=$(pwd)/rack-sdk-win
          export CROSS_COMPILE=x86_64-w64-mingw32
          export CC=x86_64-w64-mingw32-gcc
          export CXX=x86_64-w64-mingw32-g++
          export AR=x86_64-w64-mingw32-ar
          
          echo "Cross-compile environment:"
          echo "RACK_DIR=$RACK_DIR"
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          echo "CC=$CC"
          echo "CXX=$CXX"
          
      - name: Build dependencies for Windows
        run: |
          export RACK_DIR=$(pwd)/rack-sdk-win
          export CROSS_COMPILE=x86_64-w64-mingw32
          
          # First clean any previous builds
          make clean || true
          make cleandep || true
          
          # Build dependencies (efsw, QuickJS, etc.)
          echo "Building dependencies for Windows..."
          make dep
          
      - name: Build the Windows plugin
        run: |
          export RACK_DIR=$(pwd)/rack-sdk-win
          export CROSS_COMPILE=x86_64-w64-mingw32
          
          echo "Building main plugin for Windows..."
          make
          
          # Check if the DLL was created
          echo "Build output:"
          ls -la build/
          if [ -f "build/plugin.dll" ]; then
            echo "✅ Windows plugin DLL created successfully!"
          else
            echo "❌ No plugin.dll found in build directory"
            ls -la build/
            exit 1
          fi
          
      - name: Create Windows release package
        run: |
          # Create a .vcvplugin package for Windows
          mkdir -p dist
          cp -r build/plugin.dll res examples plugin.json dist/
          cd dist && zip -r ../plugin-win.zip .
          echo "Windows package created:"
          ls -la *.zip
          
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: vcv-prototype-windows
          path: |
            build/plugin.dll
            plugin-win.zip
