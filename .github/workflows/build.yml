name: Build VCV Rack Plugin
on:
  push:
    paths:
      - '**.json'
      - '.github/workflows/**'
      - 'src/**'
      - 'res/**'

env:
  rack-sdk-version: 2.4.0 # Use a stable version

defaults:
  run:
    shell: bash

jobs:

  modify-plugin-version:
    name: Modify plugin version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: plugin-version-cache
        with:
          path: plugin.json
          key: ${{ github.sha }}-${{ github.run_id }}
      - run: |
          gitrev=`git rev-parse --short HEAD`
          pluginversion=`jq -r '.version' plugin.json`
          echo "Set plugin version from $pluginversion to $pluginversion-$gitrev"
          cat <<< `jq --arg VERSION "$pluginversion-$gitrev" '.version=$VERSION' plugin.json` > plugin.json
        if: "! startsWith(github.ref, 'refs/tags/v')"

  build:
    name: Build for ${{ matrix.platform }}  # Updated name
    needs: modify-plugin-version
    runs-on: ubuntu-latest  # Standard Ubuntu runner
    # Removed the restrictive container section
    strategy:
      matrix:
        # Let's start by building Linux natively. We'll add Windows cross-compilation later.
        platform: [lin]  # Removed 'win' for now
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/cache@v4
        id: plugin-version-cache
        with:
          path: plugin.json
          key: ${{ github.sha }}-${{ github.run_id }}

      - name: Install essential build tools
        run: |
          sudo apt-get update
          # Install compiler, git, wget, and other essential tools
          sudo apt-get install -y build-essential git wget curl ca-certificates
          # Install premake4 (available in Ubuntu repos) and premake5 (we'll download)
          sudo apt-get install -y premake4
          echo "Installed tools:"
          git --version
          g++ --version
          premake4 --version

      - name: Download and install premake5
        run: |
          # Download latest premake5 binary
          wget -q https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-linux.tar.gz
          tar -xzf premake-5.0.0-beta2-linux.tar.gz
          chmod +x premake5
          sudo mv premake5 /usr/local/bin/
          echo "Premake5 version:"
          /usr/local/bin/premake5 --version

      - name: Download Rack SDK
        run: |
          # Download the Linux Rack SDK
          wget -q https://vcvrack.com/downloads/Rack-SDK-${{ env.rack-sdk-version }}-lin.zip
          unzip -q Rack-SDK-${{ env.rack-sdk-version }}-lin.zip -d rack-sdk
          echo "Rack SDK downloaded to: $(pwd)/rack-sdk"
          ls -la rack-sdk/

      - name: Build the plugin
        env:
          # Point RACK_DIR to the downloaded SDK
          RACK_DIR: ${{ github.workspace }}/rack-sdk
        run: |
          echo "Building with RACK_DIR=$RACK_DIR"
          # First, build dependencies (efsw, QuickJS, etc.)
          make dep
          # Then build the main plugin
          make
          echo "Build completed. Checking for output:"
          ls -la build/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          # Upload the built plugin library
          path: build/*.so
          name: plugin-${{ matrix.platform }}

  # Temporarily keep macOS disabled
  build-mac:
    if: false
    name: mac
    needs: modify-plugin-version
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/cache@v4
        id: plugin-version-cache
        with:
          path: plugin.json
          key: ${{ github.sha }}-${{ github.run_id }}
      - name: Get Rack-SDK
        run: |
          pushd $HOME
          wget -O Rack-SDK.zip https://vcvrack.com/downloads/Rack-SDK-${{ env.rack-sdk-version }}-mac-x64+arm64.zip
          unzip Rack-SDK.zip
      - name: Build plugin
        run: |
          CROSS_COMPILE_TARGET_x64=x86_64-apple-darwin
          CROSS_COMPILE_TARGET_arm64=arm64-apple-darwin
          export RACK_DIR=$HOME/Rack-SDK
          export CROSS_COMPILE=$CROSS_COMPILE_TARGET_${{ matrix.platform }}
          make dep
          make dist
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          path: dist/*.vcvplugin
          name: mac-${{ matrix.platform }}

  # Keep publish job for future use
  publish:
    name: Publish plugin
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build, build-mac]
    steps:
      - uses: actions/checkout@v4
      - uses: FranzDiebold/github-env-vars-action@v2
      - name: Check if plugin version matches tag
        run: |
          pluginversion=`jq -r '.version' plugin.json`
          if [ "v$pluginversion" != "${{ env.CI_REF_NAME }}" ]; then
            echo "Plugin version from plugin.json 'v$pluginversion' doesn't match with tag version '${{ env.CI_REF_NAME }}'"
            exit 1
          fi
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ env.CI_REF_NAME }}
          body: |
            ${{ env.CI_REPOSITORY_NAME }} VCV Rack Plugin ${{ env.CI_REF_NAME }}
          draft: false
          prerelease: false
      - uses: actions/download-artifact@v4
        with:
          path: _artifacts
      - name: Upload release assets
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: _artifacts/**/*
          tag: ${{ github.ref }}
          file_glob: true
